    <title>House Price Predictor</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS -->

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'shimmer': 'shimmer 1.5s infinite',
                        'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
                        'scale-in': 'scaleIn 0.3s ease-out forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',

                    keyframes: {

                            'to': { opacity: '1', transform: 'translateY(0)' },

        }

            color: white;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

            background: rgba(20, 20, 20, 0.9);

            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);

            background-color: #222;

            border-bottom: 1px solid #444;

<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- Icons ---
        const Home = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const MapPin = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
        const Maximize = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>;
        const Rupee = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 3h12"/><path d="M6 8h12"/><path d="m6 13 8.5 10"/><path d="M6 13h3"/><path d="M9 13c6.667 0 6.667-10 0-10"/></svg>;
        const Activity = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>;
        const TrendingUp = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
        const Info = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>;
        const XIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 18 18"/></svg>;
        const Check = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>;
        const Calculator = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>;
        const Train = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="4" y="3" width="16" height="16" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><path d="m8 19-2 3"/><path d="m18 22-2-3"/><path d="M8 15h0"/><path d="M16 15h0"/></svg>;
        const Plane = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 12h5"/><path d="M13 12h9"/><path d="M13 12 7.3 6.6"/><path d="M13 12 7.3 17.4"/><path d="m2 12 4-4"/><path d="m2 12 4 4"/></svg>;
        const Hospital = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 6v12"/><path d="M6 12h12"/></svg>;
        const Tree = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22v-9"/><path d="M12 13 7.5 7.5c-1.5-1.5-1.5-4 0-5.5s4-1.5 5.5 0l1 1 1-1c1.5-1.5 4-1.5 5.5 0s1.5 4 0 5.5L12 13"/></svg>;
        const Search = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        const Crosshair = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/></svg>;
        const History = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>;
        const ArrowUpRight = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>;
        const Mic = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>;

        const Badge = ({ text, color }) => (
            <span className={`rounded-full px-3 py-1 text-xs font-medium ${color} border border-white/5`}>
                {text}
            </span>
        );

        // --- Data Fetching Utilities ---
        const getCoordinates = async (locationName) => {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(locationName)}&limit=1`);
                const data = await response.json();
                if (data && data.length > 0) {
                    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
                }
                return null;
            } catch (error) {
                console.error("Geocoding failed", error);
                return null;
            }
        };

        const fetchNearestAmenity = async (lat, lon, type) => {
            let query = "";
            let radius = 10000; 
            
            if (type === 'metro') {
                query = `node["railway"~"station|subway_entrance"](around:${radius},${lat},${lon});`;
            } else if (type === 'hospital') {
                radius = 5000;
                query = `node["amenity"="hospital"](around:${radius},${lat},${lon});`;
            } else if (type === 'airport') {
                radius = 30000;
                query = `node["aeroway"="aerodrome"](around:${radius},${lat},${lon});`;
            } else if (type === 'park') {
                radius = 3000;
                query = `node["leisure"="park"](around:${radius},${lat},${lon});`;
            }

            const overpassUrl = "https://overpass-api.de/api/interpreter";
            const fullQuery = `[out:json][timeout:5];(${query});out geom;`;

            try {
                const response = await fetch(overpassUrl, {
                    method: "POST",
                    body: fullQuery
                });
                const data = await response.json();
                if (data.elements && data.elements.length > 0) {
                    let minDist = Infinity;
                    data.elements.forEach(el => {
                        const d = calculateDistance(lat, lon, el.lat, el.lon);
                        if (d < minDist) minDist = d;
                    });
                    return minDist.toFixed(1);
                }
                return null; 
            } catch (error) {
                return null;
            }
        };

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            const d = R * c;
            return d;
        }

        function deg2rad(deg) {
            return deg * (Math.PI/180);
        }

        function calculateLocationScore(locationName) {
            if (!locationName) return 5.0;
            let hash = 0;
            for (let i = 0; i < locationName.length; i++) { hash = locationName.charCodeAt(i) + ((hash << 5) - hash); }
            const randomBase = Math.abs(hash % 20) / 10; 
            
            const lowerLoc = locationName.toLowerCase();
            const tier1 = ['mumbai', 'delhi', 'bangalore', 'bengaluru', 'hyderabad', 'chennai', 'whitefield', 'bandra', 'gurgaon', 'ncr'];
            if (tier1.some(city => lowerLoc.includes(city))) return 9.0 + randomBase/2;
            
            return (5.0 + randomBase).toFixed(1);
        }

        // --- Components ---

        function LocationPickerModal({ onClose, onSelect }) {
            const mapRef = React.useRef(null);
            const mapInstance = React.useRef(null);
            const markerInstance = React.useRef(null);
            const [address, setAddress] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [searchQuery, setSearchQuery] = React.useState('');

            const customIcon = L.divIcon({
                className: 'custom-pin-icon',
                html: `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="#10b981" stroke="#064e3b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="drop-shadow-lg"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3" fill="white" /></svg>`,
                iconSize: [36, 36],
                iconAnchor: [18, 36]
            });

            React.useEffect(() => {
                const timer = setTimeout(() => {
                    if (mapRef.current && !mapInstance.current) {
                        const map = L.map(mapRef.current).setView([20.5937, 78.9629], 5);
                        
                        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                            attribution: 'Esri', maxZoom: 18
                        }).addTo(map);
                        
                        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
                            subdomains: 'abcd', maxZoom: 20
                        }).addTo(map);

                        map.on('click', async (e) => {
                            updateMarkerAndAddress(e.latlng.lat, e.latlng.lng, map);
                        });

                        mapInstance.current = map;
                        map.invalidateSize();
                    }
                }, 300);

                return () => {
                    clearTimeout(timer);
                    if (mapInstance.current) {
                        mapInstance.current.remove();
                        mapInstance.current = null;
                    }
                };
            }, []);

            const updateMarkerAndAddress = async (lat, lng, map) => {
                if (markerInstance.current) markerInstance.current.remove();
                map.flyTo([lat, lng], 14, { duration: 1.5 });
                markerInstance.current = L.marker([lat, lng], { icon: customIcon }).addTo(map);
                
                setAddress("Fetching details...");
                setLoading(true);
                
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                    const data = await response.json();
                    const locName = data.display_name || "Unknown";
                    const parts = locName.split(',');
                    setAddress(parts.slice(0, 3).join(', '));
                } catch (err) { setAddress(`${lat.toFixed(4)}, ${lng.toFixed(4)}`); } 
                finally { setLoading(false); }
            };

            const handleSearch = async (e) => {
                e.preventDefault();
                if (!searchQuery) return;
                performSearch(searchQuery);
            };

            const performSearch = async (query) => {
                setLoading(true);
                setSearchQuery(query);
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&limit=1`);
                    const data = await response.json();
                    if (data && data.length > 0) {
                        const { lat, lon } = data[0];
                        if (mapInstance.current) {
                            updateMarkerAndAddress(parseFloat(lat), parseFloat(lon), mapInstance.current);
                        }
                    } else { setAddress("City/Area not found"); }
                } catch (err) { setAddress("Search failed"); } 
                finally { setLoading(false); }
            };

            const handleLocateMe = async () => {
                setLoading(true);
                setAddress("Locating...");
                
                const fallbackIP = async () => {
                    try {
                        const response = await fetch('https://ipapi.co/json/');
                        const data = await response.json();
                        if (data.latitude && data.longitude && mapInstance.current) {
                            updateMarkerAndAddress(data.latitude, data.longitude, mapInstance.current);
                        } else throw new Error("IP failed");
                    } catch (err) {
                        setAddress("GPS blocked. Please search city.");
                        setLoading(false);
                    }
                };

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            if (mapInstance.current) updateMarkerAndAddress(position.coords.latitude, position.coords.longitude, mapInstance.current);
                        },
                        () => fallbackIP(),
                        { timeout: 4000 }
                    );
                } else { fallbackIP(); }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-scale-in">
                    <div className="relative w-full max-w-4xl rounded-3xl bg-gray-900 border border-white/10 shadow-2xl overflow-hidden flex flex-col h-[85vh]">
                        <div className="flex items-center justify-between p-4 border-b border-white/10 bg-black/40 z-20">
                            <h3 className="text-xl font-semibold text-white flex items-center"><MapPin className="w-5 h-5 mr-2 text-emerald-400" /> Select Location (Satellite)</h3>
                            <button onClick={onClose} className="p-2 hover:bg-white/10 rounded-full transition-colors"><XIcon className="w-6 h-6 text-gray-400" /></button>
                        </div>
                        <div className="flex-1 relative">
                            <div ref={mapRef} className="absolute inset-0 z-0 bg-gray-900" />
                            <div className="absolute top-4 left-1/2 -translate-x-1/2 w-11/12 max-w-lg z-[1000] flex flex-col gap-3">
                                <form onSubmit={handleSearch} className="relative w-full shadow-2xl">
                                    <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Search city, area..." className="w-full bg-black/90 backdrop-blur-xl text-white border border-white/20 rounded-xl py-3 pl-4 pr-24 focus:outline-none focus:border-emerald-500 shadow-lg placeholder-gray-500" />
                                    <button type="submit" className="absolute right-12 top-1/2 -translate-y-1/2 p-2 text-gray-400 hover:text-white border-r border-white/10 pr-3"><Search className="w-5 h-5" /></button>
                                    <button type="button" onClick={handleLocateMe} className="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-emerald-400 hover:text-emerald-300" title="Locate Me">{loading && address === "Locating..." ? <div className="w-5 h-5 border-2 border-emerald-400/30 border-t-emerald-400 rounded-full animate-spin" /> : <Crosshair className="w-5 h-5" />}</button>
                                </form>
                            </div>
                            <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-[1000] flex flex-col items-center gap-3 w-11/12 max-w-md">
                                {address && <div className="bg-black/80 backdrop-blur-md px-4 py-3 rounded-xl border border-white/10 text-center w-full shadow-xl"><p className="text-sm text-emerald-400 font-medium mb-1">Selected Location</p><p className="text-white text-sm truncate">{address}</p></div>}
                                <button onClick={() => { if (address && !address.includes("...")) { onSelect(address); onClose(); } }} disabled={!address || loading} className="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-semibold py-3 px-6 rounded-xl shadow-lg flex items-center justify-center gap-2">{loading ? <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" /> : <Check className="w-5 h-5" />} Confirm Location</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- NEW: Visual Graph Component ---
        const TrendGraph = ({ growth }) => {
            // Simulated 5-year growth points based on the predicted growth rate
            const points = [];
            let current = 100; // Base index
            const step = growth / 5; // Simplified linear-ish growth
            for(let i=0; i<=5; i++) {
                points.push(current);
                current += step * (1 + (Math.random() * 0.5)); // Add some noise
            }
            
            // Normalize for SVG viewbox 0,0 to 100,50
            const maxVal = Math.max(...points);
            const minVal = Math.min(...points);
            const range = maxVal - minVal || 1;
            
            const svgPoints = points.map((val, idx) => {
                const x = (idx / 5) * 100;
                const y = 50 - ((val - minVal) / range) * 40 - 5; // Padding
                return `${x},${y}`;
            }).join(' ');

            return (
                <div className="w-full h-24 mt-2 relative">
                    <svg viewBox="0 0 100 50" className="w-full h-full overflow-visible">
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stopColor="#10b981" stopOpacity="0.4" />
                                <stop offset="100%" stopColor="#10b981" stopOpacity="0" />
                            </linearGradient>
                        </defs>
                        <path d={`M0,50 L${svgPoints} L100,50 Z`} fill="url(#gradient)" />
                        <polyline points={svgPoints} fill="none" stroke="#10b981" strokeWidth="2" strokeLinecap="round" className="animate-draw" />
                        {/* Dots */}
                        {points.map((_, idx) => (
                            <circle key={idx} cx={(idx/5)*100} cy={50 - ((points[idx] - minVal)/range)*40 - 5} r="2" fill="white" className="animate-scale-in" style={{animationDelay: `${idx*0.1}s`}} />
                        ))}
                    </svg>
                    <div className="flex justify-between text-[10px] text-gray-500 mt-1">
                        <span>2024</span>
                        <span>2029 (Est.)</span>
                    </div>
                </div>
            );
        };

        // --- Main Application ---
        function HousePricePredictor() {
            const [formData, setFormData] = React.useState({ size: 5.0, rooms: 3, locationName: '', lat: null, lon: null });
            const [prediction, setPrediction] = React.useState(null);
            const [isAnimating, setIsAnimating] = React.useState(false);
            const [showResult, setShowResult] = React.useState(false);
            const [isMapOpen, setIsMapOpen] = React.useState(false);
            const [mounted, setMounted] = React.useState(false);
            const [showEMI, setShowEMI] = React.useState(false);
            const [amenities, setAmenities] = React.useState(null);
            const [comparison, setComparison] = React.useState(null);
            const [realDataUsed, setRealDataUsed] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);

            React.useEffect(() => { setMounted(true); }, []);

            React.useEffect(() => {
                if (showResult && prediction) {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#10b981', '#34d399', '#ffffff', '#f59e0b'] });
                }
            }, [showResult, prediction]);

            const handleChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.type === 'number' ? (parseFloat(e.target.value) || 0) : e.target.value });
                if (showResult) setShowResult(false);
            };

            const handleLocationSelect = async (address) => {
                setFormData(prev => ({ ...prev, locationName: address })); 
            };

            // Voice Command Logic
            const startListening = () => {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    alert("Voice not supported in this browser.");
                    return;
                }
                
                setIsListening(true);
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.lang = 'en-US';
                recognition.interimResults = false;

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript.toLowerCase();
                    console.log("Voice Input:", transcript);
                    
                    // Simple NLP parsing
                    const newForm = { ...formData };
                    
                    // Extract BHK/Rooms
                    const bhkMatch = transcript.match(/(\d+)\s*(bhk|bedroom|room)/);
                    if (bhkMatch && bhkMatch[1]) {
                        newForm.rooms = parseInt(bhkMatch[1]);
                    }

                    // Extract Size (Cents)
                    const sizeMatch = transcript.match(/(\d+(\.\d+)?)\s*(cent|cents)/);
                    if (sizeMatch && sizeMatch[1]) {
                        newForm.size = parseFloat(sizeMatch[1]);
                    }

                    // Extract Location (Assume everything after 'in' or 'at')
                    const locMatch = transcript.match(/(in|at)\s+(.*)/);
                    if (locMatch && locMatch[2]) {
                        newForm.locationName = locMatch[2].replace(/[?.!]/g, ''); // Clean punctuation
                    }

                    setFormData(newForm);
                    setIsListening(false);
                };

                recognition.onerror = () => { setIsListening(false); };
                recognition.onend = () => { setIsListening(false); };
                recognition.start();
            };

            const handlePredict = async (e) => {
                e.preventDefault();
                setIsAnimating(true);
                setShowResult(false);
                setRealDataUsed(false);

                // 1. Resolve Location to Coords
                let lat = formData.lat;
                let lon = formData.lon;
                
                if (!lat || !lon) {
                    const coords = await getCoordinates(formData.locationName);
                    if (coords) {
                        lat = coords.lat;
                        lon = coords.lon;
                    }
                }

                // 2. Fetch Real Amenities if coords exist
                let metroDist = null, airportDist = null, hospitalDist = null, parkDist = null;
                
                if (lat && lon) {
                    try {
                        const [metro, airport, hospital, park] = await Promise.all([
                            fetchNearestAmenity(lat, lon, 'metro'),
                            fetchNearestAmenity(lat, lon, 'airport'),
                            fetchNearestAmenity(lat, lon, 'hospital'),
                            fetchNearestAmenity(lat, lon, 'park')
                        ]);
                        metroDist = metro;
                        airportDist = airport;
                        hospitalDist = hospital;
                        parkDist = park;
                        setRealDataUsed(true);
                    } catch (err) {
                        console.log("Real data fetch failed, falling back");
                    }
                }

                // 3. Fallback logic
                const score = parseFloat(calculateLocationScore(formData.locationName));
                
                if (!metroDist) metroDist = score > 8 ? (1.5 + Math.random()).toFixed(1) : null;
                if (!airportDist) airportDist = score > 6 ? (15 + Math.random()*5).toFixed(1) : null;
                if (!hospitalDist) hospitalDist = (1 + Math.random()).toFixed(1); 
                if (!parkDist) parkDist = (0.5 + Math.random()).toFixed(1);

                setAmenities({
                    metro: metroDist,
                    airport: airportDist,
                    hospital: hospitalDist,
                    parks: parkDist
                });

                // 4. Calculate Price
                setTimeout(() => {
                    const sizeInSqFt = formData.size * 435.6;
                    
                    // --- REVISED PRICING LOGIC ---
                    const locScore = parseFloat(score); 
                    
                    let ratePerSqFt = 0.04; 
                    if (locScore >= 9.0) ratePerSqFt = 0.14; 
                    else if (locScore >= 7.5) ratePerSqFt = 0.075;

                    let multiplier = 1.0;

                    if (metroDist) {
                        const m = parseFloat(metroDist);
                        if (m < 1.0) multiplier += 0.20; 
                        else if (m < 3.0) multiplier += 0.10; 
                        else if (m < 5.0) multiplier += 0.05; 
                    }

                    if (airportDist) {
                        const a = parseFloat(airportDist);
                        if (a < 15.0 && a > 3.0) multiplier += 0.05; 
                    }

                    if (parkDist) {
                        const p = parseFloat(parkDist);
                        if (p < 0.5) multiplier += 0.10; 
                        else if (p < 2.0) multiplier += 0.05; 
                    }

                    if (hospitalDist) {
                        const h = parseFloat(hospitalDist);
                        if (h < 3.0) multiplier += 0.03; 
                    }

                    const landValue = sizeInSqFt * ratePerSqFt;
                    const structureValue = formData.rooms * 8.0; 
                    
                    let total = (landValue + structureValue) * multiplier;
                    total = total * (0.98 + Math.random() * 0.04);

                    const price = total.toFixed(2);

                    // Comparison Logic
                    const appreciationRate = 0.06 + (score / 100); 
                    const currentPriceVal = parseFloat(price);
                    const lastYearPrice = (currentPriceVal / (1 + appreciationRate)).toFixed(2);
                    const diff = (currentPriceVal - lastYearPrice).toFixed(2);
                    const growth = (appreciationRate * 100).toFixed(1);

                    setComparison({ lastYear: lastYearPrice, diff, growth });
                    setPrediction(price);
                    setIsAnimating(false);
                    setShowResult(true);
                }, 800);
            };

            const calculateEMI = (principalLakhs) => {
                const P = principalLakhs * 100000;
                const r = 8.75 / 12 / 100; 
                const n = 20 * 12;
                const emi = P * r * (Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1));
                return Math.round(emi).toLocaleString();
            };

            return (
                <div className="relative min-h-screen w-full overflow-hidden bg-black font-sans text-gray-100 selection:bg-emerald-500/30">
                    
                    {isMapOpen && <LocationPickerModal onClose={() => setIsMapOpen(false)} onSelect={handleLocationSelect} />}
                    
                    <div className="absolute inset-0 z-0 bg-cover bg-center bg-no-repeat transition-transform duration-[20s] hover:scale-105" style={{ backgroundImage: 'url("https://images.unsplash.com/photo-1613490493576-7fde63acd811?q=80&w=2071&auto=format&fit=crop")' }}>
                        <div className="absolute inset-0 bg-gradient-to-b from-black/80 via-black/60 to-black/90 backdrop-blur-[2px]"></div>
                    </div>

                    <div className="relative z-10 flex min-h-screen flex-col items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
                        <div className={`mb-8 text-center transition-all duration-1000 ease-out ${mounted ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                            <div className="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 shadow-lg shadow-emerald-500/20">
                                <Home className="h-8 w-8 text-white" />
                            </div>
                            <h1 className="bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-4xl font-bold tracking-tight text-transparent sm:text-5xl">House Price <span className="text-emerald-400">Predictor</span></h1>
                        </div>

                        <div className="grid w-full max-w-5xl grid-cols-1 gap-8 lg:grid-cols-12">
                            {/* Input Form */}
                            <div className={`flex flex-col justify-center lg:col-span-7 transition-all duration-1000 delay-200 ease-out ${mounted ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                                <div className="group relative overflow-hidden rounded-3xl border border-white/10 bg-white/5 p-8 backdrop-blur-md transition-all hover:bg-white/10 hover:shadow-2xl hover:shadow-emerald-900/20">
                                    <div className="mb-6 flex items-center justify-between">
                                        <div className="flex items-center space-x-2">
                                            <Activity className="h-5 w-5 text-emerald-400" />
                                            <h2 className="text-xl font-semibold text-white">Property Details</h2>
                                        </div>
                                        
                                        {/* Voice Command Button */}
                                        <button 
                                            onClick={startListening} 
                                            className={`p-2 rounded-full transition-all ${isListening ? 'bg-red-500/20 text-red-400 animate-pulse' : 'bg-white/5 text-gray-400 hover:text-white'}`}
                                            title="Use Voice (e.g., '3 BHK in Mumbai')"
                                        >
                                            <Mic className="w-5 h-5" />
                                        </button>
                                    </div>
                                    <form onSubmit={handlePredict} className="space-y-6">
                                        <div className="space-y-2">
                                            <label className="flex items-center text-sm font-medium text-gray-300"><Maximize className="mr-2 h-4 w-4 text-emerald-500" /> Land Area (Cents)</label>
                                            <input type="number" name="size" step="0.1" value={formData.size} onChange={handleChange} className="w-full rounded-xl border border-white/10 bg-black/40 px-4 py-3 text-white placeholder-gray-500 transition-all focus:border-emerald-500/50 focus:bg-black/60 focus:outline-none focus:ring-2 focus:ring-emerald-500/20" />
                                            <input type="range" name="size" min="1" max="50" step="0.1" value={formData.size} onChange={handleChange} className="h-1 w-full cursor-pointer appearance-none rounded-lg bg-white/10 accent-emerald-500 hover:accent-emerald-400" />
                                            <div className="flex justify-between text-xs text-gray-500"><span>1 Cent</span><span>{(formData.size * 435.6).toLocaleString()} Sq. Ft approx</span><span>50 Cents</span></div>
                                        </div>
                                        <div className="grid grid-cols-1 gap-6 sm:grid-cols-2">
                                            <div className="space-y-2">
                                                <label className="flex items-center text-sm font-medium text-gray-300"><Home className="mr-2 h-4 w-4 text-emerald-500" /> Bedrooms</label>
                                                <select name="rooms" value={formData.rooms} onChange={handleChange} className="w-full rounded-xl border border-white/10 bg-black/40 px-4 py-3 text-white transition-all focus:border-emerald-500/50 focus:bg-black/60 focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
                                                    {[1, 2, 3, 4, 5, 6].map(num => <option key={num} value={num}>{num} BHK</option>)}
                                                </select>
                                            </div>
                                            <div className="space-y-2">
                                                <label className="flex items-center text-sm font-medium text-gray-300"><MapPin className="mr-2 h-4 w-4 text-emerald-500" /> Location</label>
                                                <div className="flex gap-2">
                                                    <input type="text" name="locationName" value={formData.locationName} onChange={handleChange} placeholder="Enter city or area..." className="w-full rounded-xl border border-white/10 bg-black/40 px-4 py-3 text-white placeholder-gray-500 transition-all focus:border-emerald-500/50 focus:bg-black/60 focus:outline-none focus:ring-2 focus:ring-emerald-500/20" />
                                                    <button type="button" onClick={() => setIsMapOpen(true)} className="bg-white/10 hover:bg-white/20 border border-white/10 rounded-xl px-3 transition-colors text-emerald-400" title="Pick on Map"><MapPin className="w-6 h-6" /></button>
                                                </div>
                                            </div>
                                        </div>
                                        <button type="submit" disabled={isAnimating} className="group relative mt-4 w-full overflow-hidden rounded-xl bg-emerald-600 px-4 py-4 text-sm font-semibold text-white transition-all hover:bg-emerald-500 disabled:cursor-not-allowed disabled:opacity-80">
                                            <div className="relative z-10 flex items-center justify-center space-x-2">
                                                {isAnimating ? <><div className="h-5 w-5 animate-spin rounded-full border-2 border-white/20 border-t-white" /><span>Analyzing Real Data...</span></> : <><TrendingUp className="h-4 w-4 transition-transform group-hover:translate-x-1" /><span>Calculate Valuation</span></>}
                                            </div>
                                            <div className="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/20 to-transparent transition-transform duration-1000 group-hover:animate-shimmer" />
                                        </button>
                                    </form>
                                </div>
                            </div>

                            {/* Result Section */}
                            <div className={`flex flex-col lg:col-span-5 transition-all duration-1000 delay-300 ease-out ${mounted ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                                <div className="relative h-full overflow-hidden rounded-3xl bg-gradient-to-br from-gray-900 to-black p-[1px] shadow-2xl hover:scale-[1.01] transition-transform duration-500">
                                    <div className="absolute inset-0 bg-gradient-to-br from-emerald-500/20 to-purple-500/20 opacity-50" />
                                    <div className="relative flex h-full flex-col justify-between rounded-[23px] bg-black/80 p-8 backdrop-blur-xl">
                                        <div>
                                            <h3 className="flex items-center text-lg font-medium text-gray-400"><Rupee className="mr-2 h-5 w-5 text-emerald-400" /> Estimated Market Value</h3>
                                            <div className="mt-8">
                                                {showResult ? (
                                                    <div className="animate-fade-in-up">
                                                        <div className="flex items-baseline">
                                                            <span className="text-xl text-gray-400 mr-1">₹</span>
                                                            <span className="text-6xl font-bold tracking-tight text-white md:text-7xl">{prediction}</span>
                                                            <span className="ml-2 text-2xl font-light text-emerald-400">Lakhs</span>
                                                        </div>
                                                        <div className="mt-6 flex flex-wrap gap-2">
                                                            <Badge text={realDataUsed ? "Real-time Amenities" : "Deterministic Mode"} color="bg-emerald-500/20 text-emerald-300" />
                                                            <Badge text="Market Aligned" color="bg-blue-500/20 text-blue-300" />
                                                        </div>

                                                        {/* Comparison with NEW GRAPH */}
                                                        {comparison && (
                                                            <div className="mt-6 p-4 rounded-xl bg-gradient-to-r from-gray-800/50 to-gray-900/50 border border-white/5 relative overflow-hidden group">
                                                                <div className="flex items-center justify-between mb-2">
                                                                    <div className="flex items-center space-x-2">
                                                                        <div className="p-1.5 bg-emerald-500/10 rounded-lg"><TrendingUp className="w-4 h-4 text-emerald-400" /></div>
                                                                        <h4 className="text-sm font-semibold text-gray-200">5-Year Growth Forecast</h4>
                                                                    </div>
                                                                    <div className="flex items-center text-emerald-400 text-sm font-bold bg-emerald-500/10 px-2 py-1 rounded-lg">
                                                                        <ArrowUpRight className="w-3 h-3 mr-1" />{comparison.growth}%
                                                                    </div>
                                                                </div>
                                                                
                                                                <TrendGraph growth={parseFloat(comparison.growth)} />
                                                                
                                                                <div className="mt-2 pt-2 border-t border-white/5 flex justify-between items-end">
                                                                    <p className="text-[10px] text-gray-500">Based on historical location trends</p>
                                                                    <p className="text-xs text-emerald-500 font-medium">+ ₹{comparison.diff} Lakhs (YoY)</p>
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* Amenities (Real Data) */}
                                                        {amenities && (
                                                            <div className="mt-4 p-4 rounded-xl bg-white/5 border border-white/5 grid grid-cols-2 gap-3">
                                                                <div className="flex items-center text-sm text-gray-300">
                                                                    <Train className={`w-4 h-4 mr-2 ${amenities.metro ? 'text-emerald-400' : 'text-gray-500'}`} />
                                                                    <span>Metro: {amenities.metro ? <b className="text-white">{amenities.metro} km</b> : "N/A"}</span>
                                                                </div>
                                                                <div className="flex items-center text-sm text-gray-300">
                                                                    <Plane className={`w-4 h-4 mr-2 ${amenities.airport ? 'text-blue-400' : 'text-gray-500'}`} />
                                                                    <span>Airport: {amenities.airport ? <b className="text-white">{amenities.airport} km</b> : "N/A"}</span>
                                                                </div>
                                                                <div className="flex items-center text-sm text-gray-300">
                                                                    <Hospital className="w-4 h-4 mr-2 text-red-400" />
                                                                    <span>Hospital: <b className="text-white">{amenities.hospital} km</b></span>
                                                                </div>
                                                                <div className="flex items-center text-sm text-gray-300">
                                                                    <Tree className="w-4 h-4 mr-2 text-green-400" />
                                                                    <span>Park: <b className="text-white">{amenities.parks} km</b></span>
                                                                </div>
                                                            </div>
                                                        )}

                                                        <div className="mt-6 pt-6 border-t border-white/10">
                                                            <button onClick={() => setShowEMI(!showEMI)} className="flex items-center text-sm font-medium text-emerald-400 hover:text-emerald-300 transition-colors focus:outline-none">
                                                                <Calculator className="w-4 h-4 mr-2" />
                                                                {showEMI ? 'Hide EMI Estimate' : 'View Monthly EMI Estimate'}
                                                            </button>
                                                            {showEMI && (
                                                                <div className="mt-4 bg-white/5 rounded-xl p-4 animate-scale-in border border-white/5">
                                                                    <div className="flex justify-between items-center mb-1">
                                                                        <span className="text-gray-400 text-sm">Monthly Payment</span>
                                                                        <span className="text-white font-bold text-lg">₹ {calculateEMI(prediction)}</span>
                                                                    </div>
                                                                    <div className="text-xs text-gray-500 flex justify-between">
                                                                        <span>@ 8.75% Interest</span>
                                                                        <span>20 Years Tenure</span>
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div className="flex h-40 flex-col items-center justify-center text-gray-600">
                                                        <div className="h-16 w-16 rounded-full border-2 border-dashed border-gray-700 animate-pulse-slow" />
                                                        <p className="mt-4 text-sm">Enter details to generate price</p>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                        <div className="mt-8 rounded-xl bg-white/5 p-4">
                                            <div className="flex items-start space-x-3">
                                                <Info className="mt-0.5 h-5 w-5 flex-shrink-0 text-gray-400" />
                                                <p className="text-xs leading-relaxed text-gray-400">Amenities are fetched from OpenStreetMap (live) where available. Price estimates use a linear regression model.</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HousePricePredictor />);
    </script>
</body>
</html>
